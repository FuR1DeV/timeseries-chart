<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>timeseries-chart — tests</title>
  <style>
    body { margin: 0; padding: 24px; font: 14px/1.5 "Helvetica Neue", Arial, sans-serif; color: #333; background: #f7f7f9; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    #summary { margin: 0 0 16px; font-weight: 600; }
    #summary.pass { color: #1a7f2e; }
    #summary.fail { color: #c0392b; }
    ul { list-style: none; padding: 0; margin: 0; max-width: 900px; }
    li { padding: 4px 8px; border-bottom: 1px solid #e4e4ea; }
    li.pass::before { content: "✓ "; color: #1a7f2e; }
    li.fail::before { content: "✗ "; color: #c0392b; }
    li.fail { background: #fdecec; }
    pre { margin: 4px 0 0 20px; font-size: 12px; color: #a33; white-space: pre-wrap; }
    #sandbox { position: absolute; left: -9999px; top: 0; }
  </style>
</head>
<body>
  <h1>timeseries-chart — самопроверка</h1>
  <p id="summary">Выполняется…</p>
  <ul id="results"></ul>
  <div id="sandbox"></div>
  <script type="module" src="./tests.js"></script>
</body>
</html>
